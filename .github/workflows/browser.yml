name: Arcade browser acceptance
on:
  push:
    branches: [feature/bilingual-arcade, feature/campaign-180]
  workflow_dispatch:
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the browser
        run: |
          pip install playwright==1.55.0
          if command -v google-chrome >/dev/null; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Play both original levels with mouse and touch
        env:
          BASELINE_URL: http://127.0.0.1:4174
        run: |
          git worktree add /tmp/prallwerk-baseline e3c6b7f
          (cd /tmp/prallwerk-baseline && node scripts/dev.mjs --port 4174) > /tmp/baseline.log 2>&1 &
          for i in {1..15}; do curl -fsS "$BASELINE_URL" > /dev/null && break; sleep 1; done
          python tests/browser/baseline.py
      - name: Play the bilingual release
        if: ${{ hashFiles('tests/browser/upgrade.py') != '' }}
        run: |
          node scripts/dev.mjs --port 4175 > /tmp/prallwerk.log 2>&1 &
          for i in {1..15}; do curl -fsS http://127.0.0.1:4175 > /dev/null && break; sleep 1; done
          python tests/browser/upgrade.py
          python tests/browser/campaign.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-evidence
          path: evidence/
